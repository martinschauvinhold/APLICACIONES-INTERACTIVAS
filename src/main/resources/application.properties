spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=E-commerce;encrypt=true;trustServerCertificate=true
spring.datasource.username=appuser
spring.datasource.password=App12345!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Default solo para desarrollo (≥32 chars para HS256). En prod sobreescribir con la env var JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-only-default-secret-change-in-prod-0123456789}
jwt.expiration-ms=86400000

# Rate limiting (requests por minuto por IP)
rate-limit.auth.capacity=10
rate-limit.general.capacity=100

# Subida de imágenes de productos (multipart). Estos límites aplican a todos los
# perfiles (los application-<perfil>.properties se cargan ADEMÁS de este archivo).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Almacenamiento en disco de las imágenes y cómo se exponen públicamente.
# app.uploads.dir       -> carpeta donde se escriben los archivos
# app.uploads.url-path  -> prefijo del resource handler que las sirve estáticas
# app.uploads.base-url  -> host para construir URLs absolutas usables por el front
#
# Ojo: antes esto era relativo ("uploads/products"), lo que resolvía distinto
# según desde qué carpeta se arrancara el proceso (IDE, terminal, mvnw...) —
# cada arranque desde un lugar distinto "perdía" las imágenes subidas antes.
# Ahora es fijo dentro del home del usuario, sin importar desde dónde se arranque.
app.uploads.dir=${UPLOADS_DIR:${user.home}/vector-tech-uploads/products}
app.uploads.url-path=/uploads/products
app.uploads.base-url=${UPLOADS_BASE_URL:http://localhost:8080}
